  <style>
    .thankyou-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f8f8;
      padding: 40px 20px;
    }
    .thankyou-card {
      text-align: center;
      max-width: 600px;
      background: #fff;
      border-radius: 16px;
      padding: 60px 45px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      animation: fadeUp 0.6s ease;
    }
    .thankyou-card__icon {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #2d7d32;
      margin: 0 auto 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thankyou-card__icon svg {
      width: 45px;
      height: 45px;
      fill: #fff;
    }
    .thankyou-card h1 {
      font-family: 'Oswald', 'Arial Narrow', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 18px;
      color: #1a1a1a;
    }
    .thankyou-card p {
      font-size: 1.05rem;
      color: #666;
      line-height: 1.8;
      margin-bottom: 0;
    }
    .thankyou-card p.redirect-note {
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 30px;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
